<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>맞수</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Symbols+2&display=swap">
<style>
:root{
  --bg:#E4E2DC; --surface:#F6F5F1; --surface2:#ECEAE4; --ink:#1F2024; --muted:#6C6F78; --line:#CDCBC3;
  --accent:#2E4B8A; --accent-ink:#FFFFFF; --danger:#A6392A; --ok:#37744A; --warn:#8A6A1F;
  --wood:#D8B06B; --wood-edge:#A9803E; --wood-line:#5A4220; --stone-b:#161616; --stone-w:#F5F2EA;
  --sq-light:#E8DCC2; --sq-dark:#A6845A; --sq-sel:rgba(46,75,138,.55); --sq-last:rgba(210,160,40,.45);
  --shadow:0 1px 2px rgba(20,20,30,.08),0 8px 24px rgba(20,20,30,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171B; --surface:#1E2126; --surface2:#262A30; --ink:#E8E6E0; --muted:#9A9DA6; --line:#353941;
    --accent:#7F9CDA; --accent-ink:#0F1217; --danger:#E0725F; --ok:#6FB47F; --warn:#D3A94A;
    --wood:#C69C58; --wood-edge:#8A6630; --wood-line:#3E2C12; --stone-b:#101010; --stone-w:#F1EDE3;
    --sq-light:#C8B48E; --sq-dark:#78593A; --sq-sel:rgba(127,156,218,.6); --sq-last:rgba(211,169,74,.45);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15171B; --surface:#1E2126; --surface2:#262A30; --ink:#E8E6E0; --muted:#9A9DA6; --line:#353941;
  --accent:#7F9CDA; --accent-ink:#0F1217; --danger:#E0725F; --ok:#6FB47F; --warn:#D3A94A;
  --wood:#C69C58; --wood-edge:#8A6630; --wood-line:#3E2C12; --stone-b:#101010; --stone-w:#F1EDE3;
  --sq-light:#C8B48E; --sq-dark:#78593A; --sq-sel:rgba(127,156,218,.6); --sq-last:rgba(211,169,74,.45);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;padding-block:0 32px;padding-inline:clamp(16px,3vw,32px);min-height:100vh}
button{font:inherit;color:inherit}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-family:"Noto Serif KR",serif;font-weight:800;font-size:28px;letter-spacing:-.01em;margin:0;line-height:1}
.brand .sub{color:var(--muted);font-size:13px;letter-spacing:.06em}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px 6px 12px;cursor:pointer}
.code-chip:hover{border-color:var(--accent)}
.code-chip .lbl{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.code-chip .code{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-weight:600;font-size:18px;letter-spacing:.14em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.code-chip:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:6px}
input[type=text]{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
input.code-in{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-weight:600;font-size:20px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
label.f{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
/* Lobby */
.lobby{max-width:880px;margin:36px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lobby .wide{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow)}
.card h2{font-family:"Noto Serif KR",serif;font-weight:600;font-size:20px;margin:0 0 6px;text-wrap:balance}
.card p.desc{color:var(--muted);margin:0 0 16px;font-size:14px}
.game-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.game-opt{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center}
.game-opt .ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.game-opt .ic.omok{background:var(--wood)}
.game-opt .ic.omok::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--stone-b);box-shadow:8px -6px 0 -2px var(--stone-w)}
.game-opt .ic.janggi{background:#F4E6C3;border:2px solid #1F7A3D;color:#1F7A3D;font-family:"Noto Serif KR",serif;font-weight:800;font-size:18px;border-radius:50%}
.game-opt .ic.chess{background:var(--sq-dark);font-family:"Noto Sans Symbols 2","Segoe UI Symbol",sans-serif;font-size:24px;color:var(--sq-light);line-height:1}
.game-opt b{display:block;font-weight:700}
.game-opt small{color:var(--muted)}
.game-opt[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.row > *{flex:1 1 140px}
.row > .btn{flex:0 0 auto}
.notice{border-left:3px solid var(--warn);background:var(--surface2);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;color:var(--ink)}
.notice.err{border-color:var(--danger)}
/* Room */
.room{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;margin-top:22px;align-items:start}
.board-wrap{display:flex;justify-content:center}
.board-box{width:100%;max-width:620px}
.side{display:flex;flex-direction:column;gap:14px}
.players{display:grid;gap:8px}
.pl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid transparent}
.pl.turn{border-color:var(--accent)}
.pl .stone{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.35)}
.pl .stone.b{background:radial-gradient(circle at 35% 30%,#4a4a4a,var(--stone-b) 60%)}
.pl .stone.w{background:radial-gradient(circle at 35% 30%,#fff,var(--stone-w) 60%,#d8d3c6)}
.pl .piece{font-family:"Noto Sans Symbols 2","Segoe UI Symbol",sans-serif;font-size:24px;line-height:1;width:22px;text-align:center}
.pl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.pl .me{font-size:11px;color:var(--accent);letter-spacing:.06em}
.status{font-family:"Noto Serif KR",serif;font-size:19px;font-weight:600;padding:12px 14px;border-radius:10px;background:var(--surface2);text-wrap:balance;position:relative}
.status .clock{position:absolute;right:12px;top:10px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.status .clock.low{color:var(--danger);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.mode-pick{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mode-pick button{flex:1 1 160px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}
.mode-pick button b{display:block}
.mode-pick button small{color:var(--muted)}
.mode-pick button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.status.end{background:var(--accent);color:var(--accent-ink)}
.status small{display:block;font-family:"Noto Sans KR",sans-serif;font-weight:400;font-size:13px;opacity:.8;margin-top:2px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.moves{max-height:240px;overflow:auto;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:13px;line-height:1.7;font-variant-numeric:tabular-nums;padding:8px 12px;background:var(--surface2);border-radius:10px}
.moves .ln{display:grid;grid-template-columns:2.6em 1fr 1fr}
.moves .ln span:first-child{color:var(--muted)}
.moves .last{color:var(--accent);font-weight:600}
.legend{font-size:12px;color:var(--muted);line-height:1.6}
.legend b{color:var(--ink)}
/* Omok */
svg.omok{width:100%;height:auto;display:block;border-radius:6px;box-shadow:var(--shadow);touch-action:manipulation}
svg.omok .grid{stroke:var(--wood-line);stroke-width:1.2}
svg.omok .star{fill:var(--wood-line)}
svg.omok text{font-family:"IBM Plex Mono",monospace;font-size:13px;fill:var(--wood-line);opacity:.8}
svg.omok .sb{fill:url(#gb)}
svg.omok .sw{fill:url(#gw);stroke:#b9b3a4;stroke-width:.8}
svg.omok .forb{stroke:var(--danger);stroke-width:2.4;stroke-linecap:round}
svg.omok .lastm{fill:none;stroke:#e04a2a;stroke-width:2}
svg.omok .lastm.onb{stroke:#ff8a6a}
svg.omok.mine .hit{cursor:pointer}
/* Chess */
.chess{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;width:100%;max-width:100%;border:6px solid var(--wood-edge);border-radius:6px;box-shadow:var(--shadow);user-select:none;touch-action:manipulation;container-type:inline-size}
.sq{position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;font-family:"Noto Sans Symbols 2","Segoe UI Symbol","DejaVu Sans",sans-serif;font-size:clamp(22px,6.2vmin,46px);font-size:9cqw;line-height:1}
.sq .p{display:block;height:1em;line-height:1}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;background:var(--surface2);border-radius:10px;padding:10px 12px}
.chat h3{margin:0;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.chat .log{max-height:180px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:14px}
.chat .msg{display:flex;gap:6px;align-items:baseline}
.chat .msg b{font-weight:700;flex:none;max-width:6em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .msg.me b{color:var(--accent)}
.chat .msg span{overflow-wrap:anywhere}
.chat .empty{color:var(--muted);font-size:13px}
.chat .quick{display:flex;flex-wrap:wrap;gap:6px}
.chat .quick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.chat .quick button:hover{border-color:var(--accent)}
.chat form{display:flex;gap:6px}
.chat form input{flex:1;min-width:0;padding:7px 10px;font-size:14px}
.chat form button{flex:none}
.sq.l{background:var(--sq-light)} .sq.d{background:var(--sq-dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--sq-last)}
.sq.sel::before{content:"";position:absolute;inset:0;background:var(--sq-sel)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(200,40,30,.7),rgba(200,40,30,0) 70%)}
.sq.can::after{content:"";position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(30,40,60,.35)}
.sq.can.cap::after{width:88%;height:88%;background:none;border:4px solid rgba(30,40,60,.35)}
.sq .p{position:relative;z-index:1;pointer-events:none}
.sq .p.w{color:#F8F4EA;-webkit-text-stroke:1.2px #2b2620;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.sq .p.b{color:#1E1B18;-webkit-text-stroke:1px #000}
.sq .co{position:absolute;font-family:"IBM Plex Mono",monospace;font-size:10px;opacity:.6;pointer-events:none}
.sq .co.f{right:3px;bottom:2px} .sq .co.r{left:3px;top:2px}
.chess.mine .sq.own{cursor:pointer}
.chess.mine .sq.can{cursor:pointer}
/* Janggi */
svg.janggi{width:100%;height:auto;display:block;border-radius:6px;box-shadow:var(--shadow);touch-action:manipulation}
svg.janggi .jbg{fill:var(--wood)}
svg.janggi .grid{stroke:var(--wood-line);stroke-width:1.4}
svg.janggi text{font-family:"IBM Plex Mono",monospace;font-size:13px;fill:var(--wood-line);opacity:.8}
svg.janggi .pc polygon{fill:#F4E6C3;stroke-width:2.4}
svg.janggi .pc text{font-family:"Noto Serif KR","Batang",serif;font-weight:800;opacity:1;paint-order:stroke}
svg.janggi .pc.cho polygon{stroke:#1F7A3D} svg.janggi .pc.cho text{fill:#1F7A3D}
svg.janggi .pc.han polygon{stroke:#B4322A} svg.janggi .pc.han text{fill:#B4322A}
svg.janggi .pc.sel polygon{fill:#FFF3C4;stroke-width:4;filter:drop-shadow(0 0 4px rgba(46,75,138,.7))}
svg.janggi .lastm{fill:rgba(210,160,40,.35)}
svg.janggi .chk{fill:rgba(200,40,30,.35)}
svg.janggi .can{fill:rgba(30,40,60,.45)}
svg.janggi .can.cap{fill:none;stroke:rgba(30,40,60,.5);stroke-width:4}
svg.janggi.mine .hit{cursor:pointer}
.setup{background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.setup h3{margin:0;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.setup-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.setup-row .lbl{font-weight:700;min-width:1.6em}
.setup-row button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.setup-row button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.pl .jm{width:22px;height:22px;border-radius:50%;background:#F4E6C3;display:grid;place-items:center;font-family:"Noto Serif KR",serif;font-weight:800;font-size:13px;line-height:1}
.pl .jm.cho{border:2px solid #1F7A3D;color:#1F7A3D} .pl .jm.han{border:2px solid #B4322A;color:#B4322A}
.promo{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;margin-top:10px}
.promo button{font-family:"Noto Sans Symbols 2","Segoe UI Symbol",sans-serif;font-size:30px;line-height:1;padding:4px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media (max-width:820px){.room{grid-template-columns:1fr}.lobby{grid-template-columns:1fr}.game-pick{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="hdr">
  <div class="brand"><h1>맞수</h1><span class="sub">오목 · 체스 · 장기 1:1 대국실</span></div>
  <div class="hdr-right" id="hdrRight"></div>
</header>
<main id="main"></main>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const el=(t,a,...kids)=>{const e=document.createElement(t);if(a)for(const k in a){if(k==='class')e.className=a[k];else if(k==='text')e.textContent=a[k];else if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else if(a[k]!=null)e.setAttribute(k,a[k]);}for(const c of kids){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c));}return e;};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- identity ---------- */
let pid=LS.get('maetsu.pid');
if(!pid){pid='p'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);LS.set('maetsu.pid',pid);}
let myName=LS.get('maetsu.name','');


/* ---------- state ---------- */
let mode=null;          // 'online' | 'local'
let S=null;             // room state (host holds the authoritative copy)
let lobbyGame=LS.get('maetsu.game','omok');
let lobbyTimer=Number(LS.get('maetsu.timer','0'))||0; // 0 = 시간 제한 없음, 60 = 빠른 대국(한 수 60초)
let clockOffset=0; // client: 내 시계 - 방장 시계
let onlinePids=new Set();
const ui={sel:null,legal:[],promo:null};

/* ============================================================
   OMOK (렌주룰) ENGINE
   board: Int8Array(225) 0 empty, 1 black, 2 white. moves: [[x,y],...]
   ============================================================ */
const N=15,DIRS=[[1,0],[0,1],[1,1],[1,-1]];
const inB=(x,y)=>x>=0&&x<N&&y>=0&&y<N;
const at=(b,x,y)=>inB(x,y)?b[y*N+x]:-1;
function omokBoard(moves){const b=new Int8Array(N*N);moves.forEach((m,i)=>{if(m)b[m[1]*N+m[0]]=(i%2===0)?1:2;});return b;}
function run(b,x,y,dx,dy,c){let lo=0,hi=0;while(at(b,x+dx*(lo-1),y+dy*(lo-1))===c)lo--;while(at(b,x+dx*(hi+1),y+dy*(hi+1))===c)hi++;return{lo,hi,len:hi-lo+1};}
function omokWin(b,x,y,c){for(const[dx,dy]of DIRS){const n=run(b,x,y,dx,dy,c).len;if(c===1?n===5:n>=5)return true;}return false;}
function overline(b,x,y){for(const[dx,dy]of DIRS){if(run(b,x,y,dx,dy,1).len>=6)return true;}return false;}
// completion points for black in one direction: empty cells e where placing makes exactly five containing (x,y)
function fourPts(b,x,y,dx,dy){const pts=[];for(let i=-4;i<=4;i++){if(!i)continue;const ex=x+dx*i,ey=y+dy*i;if(at(b,ex,ey)!==0)continue;b[ey*N+ex]=1;const r=run(b,x,y,dx,dy,1);if(r.len===5&&r.lo<=i&&i<=r.hi)pts.push(i);b[ey*N+ex]=0;}return pts;}
function foursInDir(b,x,y,dx,dy){const pts=fourPts(b,x,y,dx,dy);if(pts.length<2)return pts.length;const r=run(b,x,y,dx,dy,1);if(r.len===4&&pts.includes(r.lo-1)&&pts.includes(r.hi+1))return 1;/* straight four = one four */return pts.length;}
function isStraightFourDir(b,x,y,dx,dy){const r=run(b,x,y,dx,dy,1);if(r.len!==4)return false;if(at(b,x+dx*(r.lo-1),y+dy*(r.lo-1))!==0||at(b,x+dx*(r.hi+1),y+dy*(r.hi+1))!==0)return false;if(at(b,x+dx*(r.lo-2),y+dy*(r.lo-2))===1||at(b,x+dx*(r.hi+2),y+dy*(r.hi+2))===1)return false;return true;}
function openThreeDir(b,x,y,dx,dy,depth){if(fourPts(b,x,y,dx,dy).length)return false;for(let i=-3;i<=3;i++){if(!i)continue;const ex=x+dx*i,ey=y+dy*i;if(at(b,ex,ey)!==0)continue;b[ey*N+ex]=1;let ok=false;const r=run(b,x,y,dx,dy,1);if(r.lo<=i&&i<=r.hi&&isStraightFourDir(b,x,y,dx,dy)){ok=!forbiddenPlaced(b,ex,ey,depth+1);}b[ey*N+ex]=0;if(ok)return true;}return false;}
// (x,y) already placed as black on b. Is it a forbidden move?

async function probeConn(c){try{const pc=c.peerConnection;if(!pc)return;const stats=await pc.getStats();let pair=null;stats.forEach(r=>{if(r.type==='candidate-pair'&&(r.state==='succeeded'||r.nominated)&&(!pair||r.bytesSent>pair.bytesSent))pair=r;});if(!pair)return;let kind='direct';stats.forEach(r=>{if(r.type==='local-candidate'&&r.id===pair.localCandidateId&&r.candidateType==='relay')kind='relay';if(r.type==='remote-candidate'&&r.id===pair.remoteCandidateId&&r.candidateType==='relay')kind='relay';});connKind=kind;render();}catch(e){}}
const QUICK_CHAT=['⏰ 빨리 두세요','🤔 생각 중…','👏 좋은 수!','😱 아이고','🙏 한 수만 물러주세요','☕ 잠시만요','😂','🔥','🤝 한 판 더?'];
function pushChat(from,name,text){const t=String(text||'').trim().slice(0,120);if(!t)return;const chat=(S.chat||[]).concat([{pid:from,name:String(name||'').slice(0,16),text:t,at:now()}]).slice(-40);applyPatch({chat});}
function sendChat(text){if(!S||mode!=='online')return;const t=String(text||'').trim();if(!t)return;
  if(role==='host'){pushChat(pid,myName||'플레이어 1',t);persistHost();broadcastState();render();}
  else if(hostConn&&connected)hostConn.send({t:'chat',text:t.slice(0,120)});else toast('연결이 끊겨 있어 보낼 수 없습니다.');}
let lastChatSeen=0;
function notifyChat(){if(!S||!S.chat||!S.chat.length)return;const m=S.chat[S.chat.length-1];if(m.at>lastChatSeen){if(m.pid!==pid)toast((m.name||'상대')+': '+m.text);lastChatSeen=m.at;}}
function markChatSeen(){lastChatSeen=(S&&S.chat&&S.chat.length)?S.chat[S.chat.length-1].at:now();}
const mySeat=()=>!S?null:S.seats.first===pid?'first':S.seats.second===pid?'second':null;
const turnSeat=()=>S.moves.length%2===0?'first':'second';
const seatLabel=(seat,game)=>game==='omok'?(seat==='first'?'흑':'백'):game==='janggi'?(seat==='first'?'초':'한'):(seat==='first'?'백':'흑');
const nameOf=p=>(p&&S.names&&S.names[p])||(p?'이름 없음':'대기 중');
function analyze(){return S.game==='omok'?omokAnalyze(S.moves):S.game==='janggi'?janggiReplay(S.moves,S.setup):chessReplay(S.moves);}

let peer=null,role=null;            // role: 'host' | 'client' | 'local'
let hostConn=null,connected=false;  // client side
const conns=new Map();              // host side: peerId -> {conn,pid,name}
let connecting=null;                // client: {code, attempt}
let hostRetry=0,reconnectT=null;
const hasPeer=()=>typeof window.Peer==='function';

function persistHost(){if(role==='host'&&S)LS.set('maetsu.host',JSON.stringify(S));}
function applyPatch(patch){const prevLen=S.moves.length,prevSt=S.status,prevRound=S.round;Object.assign(S,patch);S.updatedAt=now();
  if(prevLen!==S.moves.length||prevSt!==S.status||prevRound!==S.round){ui.sel=null;ui.legal=[];ui.promo=null;S.turnStartedAt=now();}}
/* ---- timer ---- */
function remainingMs(){if(!S||!S.timer||S.status!=='playing')return null;const base=(S.turnStartedAt||S.updatedAt)+(role==='client'?clockOffset:0);return base+S.timer*1000-now();}
function fmtClock(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function checkTimeout(){if(!S||S.status!=='playing'||!S.timer)return;if(!(role==='host'||mode==='local'))return;const rem=remainingMs();if(rem==null||rem>-500)return;
  const seat=turnSeat(),other=seat==='first'?'second':'first';const a=analyze();let patch;
  if((S.game==='chess'||S.game==='janggi')&&a.inCheck){patch={status:'finished',result:{type:'win',winner:other,reason:'timeout'},drawOffer:null};}
  else{const moves=S.moves.concat([S.game==='omok'?null:{pass:true}]);patch={moves,drawOffer:null};const r=S.game==='omok'?omokAnalyze(moves):S.game==='janggi'?janggiReplay(moves,S.setup):chessReplay(moves);if(r.end){patch.status='finished';patch.result=r.end;}}
  toast(seatLabel(seat,S.game)+' 시간 초과 → '+(patch.status==='finished'?'대국 종료':'상대 차례로 넘어갑니다'));
  if(mode==='local'){applyPatch(patch);render();}else{applyPatch(patch);persistHost();broadcastState();render();}}
function tickClock(){const el_=document.getElementById('clock');if(el_){const rem=remainingMs();if(rem==null)el_.textContent='';else{el_.textContent='⏱ '+fmtClock(rem);el_.classList.toggle('low',rem<10000);}}checkTimeout();}
setInterval(tickClock,250);
function write(patch){
  if(mode==='local'){applyPatch(patch);render();return;}
  if(role==='host'){applyPatch(patch);persistHost();broadcastState();render();return;}
  if(role==='client'){if(hostConn&&connected){hostConn.send({t:'patch',patch});}else toast('상대와 연결이 끊겨 있습니다. 재연결 중…');}}

/* ---- host ---- */
function hostOnline(){const s=new Set([pid]);for(const c of conns.values())if(c.pid)s.add(c.pid);return s;}
function broadcastState(){onlinePids=hostOnline();const msg={t:'state',S,online:[...onlinePids]};for(const c of conns.values()){try{if(c.conn.open)c.conn.send(msg);}catch(e){}}}
function openHostPeer(code){if(peer){try{peer.destroy();}catch(e){}}
  peer=new Peer(PEER_PREFIX+code,PEER_OPTS);
  peer.on('open',()=>{hostRetry=0;onlinePids=hostOnline();toast('방이 열렸습니다. 코드 '+code+'를 상대에게 알려 주세요.');render();});
  peer.on('connection',c=>setupHostConn(c));
  peer.on('disconnected',()=>{if(role==='host'&&peer&&!peer.destroyed){try{peer.reconnect();}catch(e){}}});
  peer.on('error',e=>{console.warn('peer error',e.type,e);
    if(e.type==='unavailable-id'){if(hostRetry++<8){toast('방 주소를 다시 여는 중… ('+hostRetry+')');setTimeout(()=>{if(role==='host')openHostPeer(code);},2500);}else toast('방 주소를 열 수 없습니다. 나가서 새 방을 만들어 주세요.');}
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){toast('연결 서버에 닿지 않습니다. 인터넷 상태를 확인해 주세요.');}
    else if(e.type!=='peer-unavailable')toast('연결 오류: '+e.type);});}
function setupHostConn(c){
  c.on('open',()=>{conns.set(c.peer,{conn:c,pid:null,name:''});setTimeout(()=>probeConn(c),1500);});
  c.on('data',msg=>handleHostMsg(c,msg));
  const drop=()=>{conns.delete(c.peer);broadcastState();render();};
  c.on('close',drop);c.on('error',drop);}
function handleHostMsg(c,msg){if(!msg||typeof msg!=='object'||!S)return;const rec=conns.get(c.peer)||{conn:c,pid:null,name:''};conns.set(c.peer,rec);
  if(msg.t==='hello'){const p=String(msg.pid||'').slice(0,40);const nm=String(msg.name||'').slice(0,16);if(!p)return;rec.pid=p;rec.name=nm;
    const names=Object.assign({},S.names);names[p]=nm||names[p]||'플레이어 2';const patch={names};
    if(S.seats.first!==p&&S.seats.second!==p&&!S.seats.second){patch.seats={first:S.seats.first,second:p};if(S.status==='waiting')patch.status='playing';}
    applyPatch(patch);persistHost();broadcastState();render();return;}
  if(msg.t==='patch'&&msg.patch&&typeof msg.patch==='object'){const seat=rec.pid&&(S.seats.first===rec.pid?'first':S.seats.second===rec.pid?'second':null);if(!seat)return;/* 관전자는 쓰기 불가 */
    const patch=Object.assign({},msg.patch);delete patch.code;delete patch.game;delete patch.creator;delete patch.chat;applyPatch(patch);persistHost();broadcastState();render();return;}
  if(msg.t==='chat'&&rec.pid){pushChat(rec.pid,(S.names&&S.names[rec.pid])||rec.name,msg.text);persistHost();broadcastState();notifyChat();render();return;}}

/* ---- client ---- */
function openClientPeer(code,attempt){connecting={code,attempt:attempt||1};render();
  if(peer){try{peer.destroy();}catch(e){}}
  peer=new Peer(PEER_OPTS);connKind=null;
  peer.on('open',()=>{const c=peer.connect(PEER_PREFIX+code,{reliable:true});hostConn=c;
    // ICE 진단: 20초 안에 데이터 채널이 안 열리면 P2P 차단으로 판단
    const t0=now();const iceT=setInterval(()=>{if(role!=='client'||hostConn!==c){clearInterval(iceT);return;}const pc=c.peerConnection;const st=pc?pc.iceConnectionState:null;
      if(connected){clearInterval(iceT);return;}
      if(st==='failed'||(now()-t0>20000&&!connected)){clearInterval(iceT);connecting=Object.assign({},connecting,{blocked:true,ice:st});render();}},1000);
    c.on('open',()=>{connected=true;connecting=null;LS.set('maetsu.client',code);LS.set('maetsu.clientAt',String(now()));c.send({t:'hello',pid,name:myName||'플레이어 2'});render();setTimeout(()=>probeConn(c),1500);});
    c.on('data',msg=>{if(!msg||msg.t!=='state'||!msg.S)return;const prev=S;S=msg.S;clockOffset=now()-S.updatedAt;onlinePids=new Set(Array.isArray(msg.online)?msg.online:[]);onlinePids.add(pid);if(!prev)markChatSeen();
      if(!prev||prev.moves.length!==S.moves.length||prev.status!==S.status||prev.round!==S.round){ui.sel=null;ui.legal=[];ui.promo=null;}notifyChat();render();});
    const lost=()=>{if(role!=='client')return;connected=false;onlinePids=new Set([pid]);render();scheduleReconnect(code);};
    c.on('close',lost);c.on('error',lost);});
  peer.on('error',e=>{console.warn('peer error',e.type,e);if(role!=='client')return;
    if(e.type==='peer-unavailable'){if(!S){toast('그 코드의 방이 없거나, 방장이 아직 접속하지 않았습니다.');leaveRoom();}else{connected=false;render();scheduleReconnect(code);}}
    else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){toast('연결 서버에 닿지 않습니다. 인터넷 상태를 확인해 주세요.');if(!S)leaveRoom();}
    else toast('연결 오류: '+e.type);});}
function scheduleReconnect(code){clearTimeout(reconnectT);reconnectT=setTimeout(()=>{if(role==='client'&&!connected)openClientPeer(code,(connecting?connecting.attempt:1)+1);},3000);}

/* ---- lobby actions ---- */
function createRoom(game,timer){if(!hasPeer()){toast('연결 라이브러리를 불러오지 못했습니다. 인터넷 연결 후 새로고침해 주세요.');return;}saveName();
  const code=genCode();S=newRoomDoc(code,game,pid,myName||'플레이어 1');S.timer=timer||0;role='host';mode='online';hostRetry=0;markChatSeen();persistHost();LS.del('maetsu.client');openHostPeer(code);render();}
function joinRoom(codeRaw){if(!hasPeer()){toast('연결 라이브러리를 불러오지 못했습니다. 인터넷 연결 후 새로고침해 주세요.');return;}const code=(codeRaw||'').trim().toUpperCase();if(code.length<4){toast('방 코드를 입력해 주세요.');return;}saveName();
  role='client';mode='online';S=null;connected=false;LS.del('maetsu.host');openClientPeer(code,1);}
function startLocal(game,timer){saveName();mode='local';role='local';S=newRoomDoc('LOCAL',game,pid,myName||'플레이어 1');S.timer=timer||0;S.seats.second='local2';S.names.local2='플레이어 2';S.status='playing';ui.sel=null;ui.legal=[];render();}
function leaveRoom(){clearTimeout(reconnectT);if(peer){try{peer.destroy();}catch(e){}peer=null;}hostConn=null;connected=false;conns.clear();connecting=null;S=null;mode=null;role=null;onlinePids=new Set();LS.del('maetsu.host');LS.del('maetsu.client');render();}
function saveName(){const inp=$('#nameIn');if(inp){myName=inp.value.trim().slice(0,16);LS.set('maetsu.name',myName);}}

/* moves */
function localActor(){return mode==='local'?turnSeat():mySeat();}
function canAct(){if(!S||S.status!=='playing')return false;if(role==='client'&&!connected)return false;const seat=localActor();return !!seat&&seat===turnSeat();}
function placeOmok(x,y){if(!canAct())return;const a=analyze();if(a.b[y*N+x]!==0)return;
  if(a.turn===1&&isForbidden(a.b,x,y)){toast('금수입니다 (3·3, 4·4, 장목). 다른 곳에 두세요.');return;}
  const moves=S.moves.concat([[x,y]]);const r=omokAnalyze(moves);const patch={moves,drawOffer:null};if(r.end){patch.status='finished';patch.result=r.end;}write(patch);}
function commitChess(m){const moves=S.moves.concat([{from:m.from,to:m.to,promo:m.promo||null}]);const r=chessReplay(moves);const patch={moves,drawOffer:null};if(r.end){patch.status='finished';patch.result=r.end;}ui.sel=null;ui.legal=[];ui.promo=null;write(patch);}
function resign(){if(!S||S.status!=='playing')return;const seat=localActor();if(!seat)return;const winner=seat==='first'?'second':'first';write({status:'finished',result:{type:'win',winner,reason:'resign',by:seat},drawOffer:null});}
function offerDraw(){const seat=localActor();if(!seat||S.status!=='playing')return;if(mode==='local'){write({status:'finished',result:{type:'draw',reason:'agreed'}});return;}write({drawOffer:pid});}
function answerDraw(accept){if(accept)write({status:'finished',result:{type:'draw',reason:'agreed'},drawOffer:null});else write({drawOffer:null});}
function voteRematch(){if(!S||S.status!=='finished')return;if(mode==='local'){resetGame();return;}const seat=mySeat();if(!seat)return;const votes=Object.assign({},S.rematch,{[pid]:true});
  const both=S.seats.first&&S.seats.second&&votes[S.seats.first]&&votes[S.seats.second];if(both)resetGame();else write({rematch:votes});}
function resetGame(){write({moves:[],status:'playing',result:null,drawOffer:null,rematch:{},seats:{first:S.seats.second,second:S.seats.first},round:(S.round||1)+1});}
function refreshOnline(){if(role==='host')onlinePids=hostOnline();else if(mode==='local')onlinePids=new Set();}

  const create=el('div',{class:'card'},el('h2',{text:'방 만들기'}),el('p',{class:'desc',text:'코드가 생성됩니다. 상대에게 코드를 알려 주면 입장합니다. 방을 만든 사람이 선수(오목 흑 · 체스 백)이며, 대국 중에는 두 사람이 모두 이 페이지를 열어 두어야 합니다.'}),pick,modePick,

  const join=el('div',{class:'card'},el('h2',{text:'방 입장'}),el('p',{class:'desc',text:'상대가 알려준 5자리 코드를 입력하세요. 두 자리가 다 찼으면 관전으로 들어갑니다.'}),

function renderJanggi(a){const M=44,ST=56,W=M*2+ST*8,H=M*2+ST*9;const NS='http://www.w3.org/2000/svg';const sv=document.createElementNS(NS,'svg');sv.setAttribute('viewBox','0 0 '+W+' '+H);sv.setAttribute('class','janggi'+(canAct()?' mine':''));

  for(let x=0;x<JW;x++){const t=mk('text',{x:px(x),y:H-12,'text-anchor':'middle'});t.textContent='abcdefghi'[x];sv.append(t);}
  for(let y=0;y<JH;y++){const t=mk('text',{x:14,y:py(y)+4.5,'text-anchor':'middle'});t.textContent=String(10-y);sv.append(t);}
  const st=a.st;const me=st.turn;const ksq=st.board.indexOf(me+'K');
  if(st.last){for(const i of[st.last.from,st.last.to]){const x=i%JW,y=(i-x)/JW;sv.append(mk('rect',{class:'lastm',x:px(x)-25,y:py(y)-25,width:50,height:50,rx:8}));}}

    const g=mk('g',{class:'pc '+(p[0]==='f'?'cho':'han')+(ui.sel===i?' sel':'')});
    const pts=[];for(let k=0;k<8;k++){const ang=Math.PI/8+k*Math.PI/4;pts.push((px(x)+r*Math.cos(ang)).toFixed(1)+','+(py(y)+r*Math.sin(ang)).toFixed(1));}

function onJSq(idx,a){if(!canAct())return;const st=a.st;const p=st.board[idx];

  const me=st.turn;const ksq=kingSq(st.board,me);
